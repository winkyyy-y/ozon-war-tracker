    #app-container { display: flex; height: 100vh; width: 100vw; position: relative; }

    /* 左侧面板 */
    #sidebar {
      width: 440px;
      height: 100%;
      background: #f8fafc;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 4px 0 16px rgba(0,0,0,0.06);
    }

    .header-box { padding: 18px 20px 14px; background: #fff; border-bottom: 1px solid #edf2f7; }
    .header-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .header-title h2 { font-size: 18px; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 8px; }
    .live-badge {
      font-size: 12px; background: #fee2e2; color: #dc2626; padding: 3px 8px; border-radius: 20px;
      font-weight: 600; display: inline-flex; align-items: center; gap: 4px;
    }
    .live-badge::before { content: ""; width: 6px; height: 6px; background: #dc2626; border-radius: 50%; }

    /* 顶部统计卡片 */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
    .stat-card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; text-align: center;
      transition: all 0.2s ease; cursor: pointer;
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .stat-card.ozon-attack .num { color: #e11d48; }
    .stat-card.wb-attack .num { color: #8b5cf6; }
    .stat-card.ozon-normal .num { color: #2563eb; }
    .stat-card .num { font-size: 22px; font-weight: 800; line-height: 1.2; }
    .stat-card .label { font-size: 11px; color: #64748b; font-weight: 600; margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .stat-card .dot { width: 7px; height: 7px; border-radius: 50%; }

    /* 搜索栏与过滤标签 */
    .search-box { position: relative; margin-bottom: 12px; }
    .search-box input {
      width: 100%; padding: 9px 12px 9px 34px; border: 1px solid #cbd5e1; border-radius: 8px;
      font-size: 13px; outline: none; background: #f1f5f9; transition: all 0.2s;
    }
    .search-box input:focus { background: #fff; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 14px; color: #94a3b8; }

    .filter-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag-btn {
      border: 1px solid #cbd5e1; background: #fff; color: #475569; font-size: 12px; font-weight: 500;
      padding: 4px 10px; border-radius: 16px; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 4px;
    }
    .tag-btn:hover { background: #f1f5f9; }
    .tag-btn.active { background: #1e293b; color: #fff; border-color: #1e293b; font-weight: 600; }
    .tag-btn.active[data-filter="all_attack"] { background: #ea580c; border-color: #ea580c; }
    .tag-btn.active[data-filter="ozon_attack"] { background: #dc2626; border-color: #dc2626; }
    .tag-btn.active[data-filter="wb_attack"] { background: #8b5cf6; border-color: #8b5cf6; }
    .tag-btn.active[data-filter="ozon_normal"] { background: #2563eb; border-color: #2563eb; }

    .warehouse-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .warehouse-card {

    .warehouse-card.active-card { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
    
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }

    .badge-wb-attack { background: #ede9fe; color: #6d28d9; }
    .badge-ozon-normal { background: #dbeafe; color: #1d4ed8; }

    .card-desc { font-size: 11.5px; color: #64748b; line-height: 1.5; }

    /* 右侧地图 */
    #map { flex: 1; height: 100%; background: #e5e7eb; }

    .custom-popup .leaflet-popup-content-wrapper { border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); padding: 4px; }

</head>

  // 2. 初始化地图
  const map = L.map('map', { zoomControl: false }).setView([55.0, 46.0], 5);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; CartoDB &copy; OpenStreetMap',
    maxZoom: 18
  }).addTo(map);

  // 3. 矢量水滴图钉
  function createCustomIcon(color) {
    const svgIcon = `
      <svg width="30" height="40" viewBox="0 0 32 42" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 0C7.16344 0 0 7.16344 0 16C0 26.5 16 42 16 42C16 42 32 26.5 32 16C32 7.16344 24.8366 0 16 0Z" fill="${color}"/>
        <circle cx="16" cy="15" r="5.5" fill="white"/>
      </svg>`;
    return L.divIcon({
      html: svgIcon,
      className: 'map-pin',
      iconSize: [30, 40],
      iconAnchor: [15, 40],
      popupAnchor: [0, -36]
    });
  }

  const icons = {
    ozon_attack: createCustomIcon('#e11d48'),
    wb_attack: createCustomIcon('#8b5cf6'),
    ozon_normal: createCustomIcon('#2563eb')
  };

  let markers = {};
  let currentFilter = 'all';

  function updateStats() {
    const ozonAttack = warehouseData.filter(d => d.type === 'ozon_attack').length;
    const wbAttack = warehouseData.filter(d => d.type === 'wb_attack').length;
    const ozonNormal = warehouseData.filter(d => d.type === 'ozon_normal').length;

    document.getElementById('stat-ozon-attack').innerText = ozonAttack;
    document.getElementById('stat-wb-attack').innerText = wbAttack;
    document.getElementById('stat-ozon-normal').innerText = ozonNormal;
  }

  function getPopupContent(item) {
    const titlePrefix = item.type === 'ozon_normal' ? '正常' : `遭袭 ${item.date}`;
    return `
      <div class="popup-title">[${titlePrefix}] ${item.name}</div>
      <div class="popup-row"><strong>平台:</strong> ${item.platform} | <strong>规模:</strong> ${item.scale}</div>
      <div class="popup-row"><strong>状态:</strong> <span style="color:${item.type === 'ozon_normal' ? '#2563eb':'#e11d48'};font-weight:700;">${item.status}</span></div>
      <div class="popup-row"><strong>日期:</strong> ${item.date}</div>
      <div class="popup-row" style="margin-top:6px;color:#64748b;">${item.desc}</div>
      <div class="popup-coord">📍 ${item.coords[0].toFixed(4)}, ${item.coords[1].toFixed(4)}</div>
    `;
  }

  function renderView(items) {
    const listContainer = document.getElementById('warehouseList');
    listContainer.innerHTML = '';

    Object.values(markers).forEach(m => map.removeLayer(m));
    markers = {};

    items.forEach(item => {
      let badgeClass = 'badge-ozon-attack';
      let tagLabel = 'Ozon遭袭';
      if (item.type === 'wb_attack') { badgeClass = 'badge-wb-attack'; tagLabel = 'WB遭袭'; }
      if (item.type === 'ozon_normal') { badgeClass = 'badge-ozon-normal'; tagLabel = 'Ozon正常'; }

      const titlePrefix = item.type === 'ozon_normal' ? '正常' : `遭袭 ${item.date.slice(5)}`;

      const card = document.createElement('div');
      card.className = 'warehouse-card';
      card.id = `card-${item.id}`;
      card.innerHTML = `
        <div class="card-head">
          <div class="card-title">[${titlePrefix}] ${item.name}</div>
          <span class="badge-pill ${badgeClass}">${tagLabel}</span>
        </div>
        <div class="card-status">${item.status} (${item.date})</div>
        <div class="card-desc">${item.desc}</div>
      `;

      card.onclick = () => focusWarehouse(item);
      listContainer.appendChild(card);

      const marker = L.marker(item.coords, { icon: icons[item.type] })
        .bindPopup(getPopupContent(item), { className: 'custom-popup', maxWidth: 300 })
        .addTo(map);

      marker.on('click', () => highlightCard(item.id));
      markers[item.id] = marker;
    });
  }

  function focusWarehouse(item) {
    map.flyTo(item.coords, 8, { duration: 1 });
    const marker = markers[item.id];
    if (marker) marker.openPopup();
    highlightCard(item.id);
  }

  function highlightCard(id) {
    document.querySelectorAll('.warehouse-card').forEach(c => c.classList.remove('active-card'));
    const targetCard = document.getElementById(`card-${id}`);
    if (targetCard) {
      targetCard.classList.add('active-card');
      targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  function filterData() {
    const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
    
    return warehouseData.filter(item => {
      let matchesType = true;
      if (currentFilter === 'ozon_attack') matchesType = item.type === 'ozon_attack';
      else if (currentFilter === 'wb_attack') matchesType = item.type === 'wb_attack';
      else if (currentFilter === 'ozon_normal') matchesType = item.type === 'ozon_normal';
      else if (currentFilter === 'all_attack') matchesType = item.type.includes('attack');

      let matchesKeyword = true;
      if (keyword) {
        matchesKeyword = item.name.toLowerCase().includes(keyword) ||
                         item.desc.toLowerCase().includes(keyword) ||
                         item.scale.toLowerCase().includes(keyword) ||
                         item.status.toLowerCase().includes(keyword);
      }

      return matchesType && matchesKeyword;
    });
  }

  function setFilter(filterType) {
    currentFilter = filterType;
    document.querySelectorAll('.tag-btn').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-filter') === filterType);
    });

    const filtered = filterData();
    renderView(filtered);
  }

  function handleSearch() {
    const filtered = filterData();
    renderView(filtered);
  }

  // 初始化
  updateStats();
  renderView(warehouseData);

  // 视野居中适配
  const coreCoords = warehouseData.filter(d => d.coords[1] < 90).map(d => d.coords);
  map.fitBounds(coreCoords, { padding: [40, 40] });
</script>
