<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>俄罗斯电商仓网全自动安全监测地图</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #e5e3df; }
    #map { width: 100%; height: 100%; z-index: 1; }

    .dashboard-panel {
      position: absolute; top: 16px; left: 16px; z-index: 1000; width: 390px;
      max-height: calc(100vh - 32px); background: #ffffff; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25); display: flex; flex-direction: column; overflow: hidden;
    }
    .panel-header { padding: 14px 16px; border-bottom: 1px solid #e8eaed; display: flex; justify-content: space-between; align-items: center; }
    .panel-header h1 { font-size: 14px; font-weight: 700; color: #202124; display: flex; align-items: center; gap: 8px; }
    .live-badge { font-size: 11px; font-weight: 600; color: #1a73e8; background: #e8f0fe; padding: 2px 8px; border-radius: 12px; }

    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 10px 14px; background: #f8f9fa; border-bottom: 1px solid #e8eaed; }
    .stat-card { text-align: center; padding: 6px; background: #ffffff; border-radius: 6px; border: 1px solid #dadce0; }
    .stat-card .val { font-size: 18px; font-weight: 700; }
    .stat-card .lbl { font-size: 11px; color: #5f6368; }

    .list-container { flex: 1; overflow-y: auto; padding: 8px 14px; max-height: 420px; }
    .list-item { padding: 8px 10px; margin-bottom: 6px; border-radius: 6px; border: 1px solid #e8eaed; cursor: pointer; }
    .list-item:hover { background: #f8f9fa; }
    .item-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; }
    .item-desc { font-size: 11px; color: #5f6368; margin-top: 3px; line-height: 1.3; }

    .gmap-pin-wrap { width: 28px; height: 38px; cursor: pointer; filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.35)); }
    .gmap-pin-svg { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="dashboard-panel">
    <div class="panel-header">
      <h1><i class="fa-solid fa-satellite" style="color:#d93025;"></i> 全网自动监测地图</h1>
      <span class="live-badge" id="syncStatus">联网同步中...</span>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="val" id="cntOz" style="color:#d93025;">0</div><div class="lbl">🔴 Ozon 遭袭/火情</div></div>
      <div class="stat-card"><div class="val" id="cntWb" style="color:#9333ea;">0</div><div class="lbl">🟣 WB 遭袭/火情</div></div>
    </div>

    <div class="list-container" id="warehouse-list"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map', { center: [54.5, 46.0], zoom: 5, zoomControl: false });
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 18 }).addTo(map);

    let markers = [];

    function getPinIcon(type) {
      let color = type === 'ozon-damaged' ? '#d93025' : '#9333ea';
      return L.divIcon({
        className: 'custom-pin',
        html: `
          <div class="gmap-pin-wrap">
            <svg class="gmap-pin-svg" viewBox="0 0 28 38" fill="none">
              <path d="M14 0C6.268 0 0 6.268 0 14C0 24.5 14 38 14 38C14 38 28 24.5 28 14C28 6.268 21.732 0 14 0Z" fill="${color}"/>
              <circle cx="14" cy="14" r="5.5" fill="#FFFFFF"/>
            </svg>
          </div>`,
        iconSize: [28, 38],
        iconAnchor: [14, 38],
        popupAnchor: [0, -36]
      });
    }

    async function loadAutoTrackedData() {
      const statusEl = document.getElementById('syncStatus');
      try {
        // 添加时间戳防止浏览器缓存
        const res = await fetch('./data.json?_t=' + Date.now());
        if (!res.ok) throw new Error("无法读取数据文件");
        const data = await res.json();

        // 清理旧标记
        markers.forEach(m => map.removeLayer(m));
        markers = [];

        const listEl = document.getElementById('warehouse-list');
        listEl.innerHTML = '';

        let ozCount = 0, wbCount = 0;
        let coords = [];

        data.forEach(item => {
          if (item.type === 'ozon-damaged') ozCount++;
          if (item.type === 'wb-damaged') wbCount++;

          const marker = L.marker([item.lat, item.lng], { icon: getPinIcon(item.type) });
          marker.bindPopup(`
            <div style="font-size:12px; line-height:1.4;">
              <b style="font-size:13px; color:#202124;">${item.name}</b><br>
              <b>时间:</b> ${item.date}<br>
              <b>新闻摘要:</b> ${item.details}<br>
              ${item.source_url ? `<a href="${item.source_url}" target="_blank" style="color:#1a73e8;">查看新闻报道</a>` : ''}
            </div>
          `);
          marker.addTo(map);
          markers.push(marker);
          coords.push([item.lat, item.lng]);

          const div = document.createElement('div');
          div.className = 'list-item';
          div.innerHTML = `
            <div class="item-header"><span>${item.name}</span></div>
            <div class="item-desc">${item.details} (${item.date})</div>
          `;
          div.addEventListener('click', () => {
            map.flyTo([item.lat, item.lng], 8, { duration: 1.2 });
            marker.openPopup();
          });
          listEl.appendChild(div);
        });

        document.getElementById('cntOz').innerText = ozCount;
        document.getElementById('cntWb').innerText = wbCount;
        statusEl.innerText = "已同步 " + new Date().toLocaleTimeString();

        if (coords.length > 0 && !window.hasFit) {
          map.fitBounds(coords, { padding: [40, 40] });
          window.hasFit = true;
        }
      } catch (e) {
        statusEl.innerText = "等待数据初始化...";
        console.error(e);
      }
    }

    // 初始化加载并每 60 秒轮询一次
    loadAutoTrackedData();
    setInterval(loadAutoTrackedData, 60000);
  </script>
</body>
</html>
