name: Auto News Tracker

on:
  schedule:
    - cron: '*/30 * * * *'  # 每 30 分钟全自动执行一次
  workflow_dispatch:        # 支持在网页上手动点击“立即运行”

jobs:
  track-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Crawler & Geocoder
        run: python auto_tracker.py

      - name: Commit and push if data changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data.json
          git commit -m "Auto-update latest warehouse attack records [skip ci]" || exit 0
          git push
